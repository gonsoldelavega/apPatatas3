name: Watch exact FactuPapa audit

on:
  push:
    branches: [codex/watch-adf89b2]

permissions:
  actions: read
  statuses: write
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA: adf89b2014e69ca7a2550138e29758a7ab0432b1
      TARGET_BRANCH: codex/factupapa-claude-fixes
      WORKFLOW_FILE: factupapa-next-runner.yml
    steps:
      - name: Watch rootless audit
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          headers=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28')
          run_id=''
          run_url=''
          for _ in $(seq 1 60); do
            response="$(curl --fail-with-body --silent --show-error --get "${headers[@]}" \
              --data-urlencode "branch=${TARGET_BRANCH}" --data-urlencode 'event=workflow_dispatch' \
              --data-urlencode 'per_page=20' "${api}/actions/workflows/${WORKFLOW_FILE}/runs")"
            run_id="$(jq -r --arg sha "${EXPECTED_SHA}" '.workflow_runs[] | select(.head_sha==$sha) | .id' <<<"${response}" | head -1)"
            run_url="$(jq -r --arg sha "${EXPECTED_SHA}" '.workflow_runs[] | select(.head_sha==$sha) | .html_url' <<<"${response}" | head -1)"
            [ -n "${run_id}" ] && break
            sleep 10
          done
          if [ -z "${run_id}" ]; then
            payload="$(jq -n --arg state error --arg context 'FactuPapa Rootless Audit' --arg description 'No se encontró la auditoría solicitada' '{state:$state,context:$context,description:$description}')"
            curl --fail-with-body --silent --show-error -X POST "${headers[@]}" --data "${payload}" "${api}/statuses/${EXPECTED_SHA}" >/dev/null
            exit 1
          fi
          payload="$(jq -n --arg state pending --arg context 'FactuPapa Rootless Audit' --arg description 'Auditoría rootless en ejecución' --arg target_url "${run_url}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
          curl --fail-with-body --silent --show-error -X POST "${headers[@]}" --data "${payload}" "${api}/statuses/${EXPECTED_SHA}" >/dev/null
          for _ in $(seq 1 180); do
            run="$(curl --fail-with-body --silent --show-error "${headers[@]}" "${api}/actions/runs/${run_id}")"
            status="$(jq -r '.status' <<<"${run}")"
            if [ "${status}" = completed ]; then
              conclusion="$(jq -r '.conclusion' <<<"${run}")"
              state=failure
              description="Auditoría finalizada: ${conclusion}"
              [ "${conclusion}" = success ] && state=success && description='Auditoría rootless y despliegue completados'
              payload="$(jq -n --arg state "${state}" --arg context 'FactuPapa Rootless Audit' --arg description "${description}" --arg target_url "${run_url}" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
              curl --fail-with-body --silent --show-error -X POST "${headers[@]}" --data "${payload}" "${api}/statuses/${EXPECTED_SHA}" >/dev/null
              [ "${state}" = success ] && exit 0
              exit 1
            fi
            sleep 20
          done
          exit 1

      - name: Remove observer branch
        if: always()
        shell: bash
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" --delete codex/watch-adf89b2
