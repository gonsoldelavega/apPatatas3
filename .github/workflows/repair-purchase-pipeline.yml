name: Repair purchase pipeline

on:
  push:
    branches:
      - codex/factupapa-next-quality-sweep
    paths:
      - ".github/workflows/repair-purchase-pipeline.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/factupapa-next-quality-sweep
          fetch-depth: 1

      - name: Add safe web bootstrap and remove unsupported API executable
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          code_path = Path('apps-script/gonsol-drive-organizer/Code.gs')
          s = code_path.read_text()

          if 'function ensurePurchaseInvoiceScheduleFromWeb_()' not in s:
              needle = """    if (REGISTRY_WEBAPP_TOKEN && String(params.key || '') !== REGISTRY_WEBAPP_TOKEN) {
                return jsonOutput_({ ok: false, error: 'unauthorized' });
              }
              var ss = SpreadsheetApp.openById(GONSOL_CONFIG.masterSpreadsheetId);
          """
              repl = """    if (REGISTRY_WEBAPP_TOKEN && String(params.key || '') !== REGISTRY_WEBAPP_TOKEN) {
                return jsonOutput_({ ok: false, error: 'unauthorized' });
              }
              // La lectura del Registro Maestro sirve también como punto de auto-reparación
              // del calendario. El fallo de autorización se informa, pero NUNCA rompe
              // la lectura del registro.
              var scheduler = ensurePurchaseInvoiceScheduleFromWeb_();
              var ss = SpreadsheetApp.openById(GONSOL_CONFIG.masterSpreadsheetId);
          """
              if s.count(needle) != 1:
                  raise SystemExit('No se encontro el punto de insercion doGet esperado')
              s = s.replace(needle, repl, 1)

              needle = """      count: rows.length,
                source: 'apps-script-webapp',
                generatedAt: new Date().toISOString()
          """
              repl = """      count: rows.length,
                source: 'apps-script-webapp',
                scheduler: scheduler,
                generatedAt: new Date().toISOString()
          """
              if s.count(needle) != 1:
                  raise SystemExit('No se encontro el payload doGet esperado')
              s = s.replace(needle, repl, 1)

              marker = """function jsonOutput_(payload) {
          """
              helper = """function ensurePurchaseInvoiceScheduleFromWeb_() {
            try {
              ensurePurchaseInvoiceSchedule_();
              var triggers = ScriptApp.getProjectTriggers().filter(function(trigger) {
                return trigger.getHandlerFunction() === 'processPurchaseInvoicesDaily';
              });
              return {
                ok: triggers.length === 4,
                triggerCount: triggers.length,
                scheduleVersion: PropertiesService.getScriptProperties()
                  .getProperty('purchaseInvoiceTriggerScheduleVersion') || ''
              };
            } catch (error) {
              var authRequired = true;
              try {
                var authInfo = ScriptApp.getAuthorizationInfo(ScriptApp.AuthMode.FULL, GONSOL_REQUIRED_SCOPES);
                authRequired = String(authInfo.getAuthorizationStatus()) !== 'NOT_REQUIRED';
              } catch (_) {}
              console.error('Auto-reparacion de triggers pendiente: ' + error);
              return {
                ok: false,
                authorizationRequired: authRequired,
                error: String(error && error.message ? error.message : error)
              };
            }
          }

          """
              if s.count(marker) != 1:
                  raise SystemExit('No se encontro jsonOutput_ para insertar helper')
              s = s.replace(marker, helper + marker, 1)

          code_path.write_text(s)

          manifest_path = Path('apps-script/gonsol-drive-organizer/appsscript.json')
          manifest = json.loads(manifest_path.read_text())
          manifest.pop('executionApi', None)
          trigger_scope = 'https://www.googleapis.com/auth/script.scriptapp'
          scopes = list(manifest.get('oauthScopes', []))
          if trigger_scope not in scopes:
              scopes.append(trigger_scope)
          manifest['oauthScopes'] = scopes
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n')
          PY

          git diff --check
          git diff -- apps-script/gonsol-drive-organizer/Code.gs apps-script/gonsol-drive-organizer/appsscript.json

      - name: Commit repair
        run: |
          set -euo pipefail
          git config user.name "gonsoldelavega"
          git config user.email "gonsoldelavega@gmail.com"
          git add apps-script/gonsol-drive-organizer/Code.gs apps-script/gonsol-drive-organizer/appsscript.json
          git diff --cached --quiet && { echo "No changes needed"; exit 0; }
          git commit -m "fix: self-heal purchase schedule from registry webapp"
          git push origin HEAD:codex/factupapa-next-quality-sweep
