name: Harden Gmail invoice importer once

on:
  push:
    branches: [codex/factupapa-next-quality-sweep]
    paths:
      - '.github/workflows/harden-gmail-importer-once.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/factupapa-next-quality-sweep
          fetch-depth: 0

      - name: Replace Gmail importer with label plus SHA audit
        shell: bash
        env:
          IMPORTER_B64: 
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          p = Path('apps-script/gonsol-drive-organizer/Code.gs')
          s = p.read_text()
          start = s.index('const GONSOL_GMAIL_IMPORT = {')
          end = s.index('const GONSOL_MONTHS = [', start)
          replacement = base64.b64decode(os.environ['IMPORTER_B64']).decode('utf-8')
          p.write_text(s[:start] + replacement + s[end:])
          PY

      - name: Validate organizer
        shell: bash
        run: |
          cp apps-script/gonsol-drive-organizer/Code.gs /tmp/gonsol-organizer.js
          node --check /tmp/gonsol-organizer.js
          grep -F "processedLabel: 'FACTURAS_IMPORTADAS'" apps-script/gonsol-drive-organizer/Code.gs
          grep -F "known.digests[digest]" apps-script/gonsol-drive-organizer/Code.gs
          grep -F "maxThreadsPerRun: 100" apps-script/gonsol-drive-organizer/Code.gs
          git diff --check

      - name: Commit hardened importer
        shell: bash
        run: |
          git config user.name 'FactuPapa automation'
          git config user.email 'gonsoldelavega@gmail.com'
          git add apps-script/gonsol-drive-organizer/Code.gs
          git commit -m 'fix(purchases): make Gmail import idempotent by label and SHA'
          git push origin HEAD:codex/factupapa-next-quality-sweep
