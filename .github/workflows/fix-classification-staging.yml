name: One-shot purchase and ledger reorganization

on:
  push:
    branches:
      - codex/factupapa-next-quality-sweep
    paths:
      - .github/workflows/fix-classification-staging.yml

permissions:
  contents: write

jobs:
  reorganize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: codex/factupapa-next-quality-sweep
          fetch-depth: 0
      - name: Apply finance reorganization
        run: python3 factupapa-next/scripts/reorganize-finance.py
      - name: Validate API and web
        run: |
          set -euo pipefail
          git diff --check
          cd factupapa-next/apps/api
          npm ci
          npm test
          npm run typecheck
          cd ../web
          npm ci
          npm test -- --run
          npm run build
      - name: Commit validated changes
        run: |
          set -euo pipefail
          git config user.name 'FactuPapa automation'
          git config user.email 'actions@users.noreply.github.com'
          git add factupapa-next/packages/database/0024_purchase_soft_delete.sql \
            factupapa-next/apps/api/src/finance/service.ts \
            factupapa-next/apps/api/src/finance/routes.ts \
            factupapa-next/apps/api/test/integration/document-classification.integration.test.ts \
            factupapa-next/apps/web/src/api/services.ts \
            factupapa-next/apps/web/src/pages/PurchaseDetailPage.tsx \
            factupapa-next/apps/web/src/pages/ExpensesPage.tsx
          git commit -m '[deploy-staging] Add auditable purchase deletion and reorganize finance views'
          git push origin HEAD:codex/factupapa-next-quality-sweep