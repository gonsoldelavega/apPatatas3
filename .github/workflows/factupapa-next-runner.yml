name: FactuPapa Next Rootless Audit

on:
  push:
    branches: [design/factupapa-full-prototype, codex/factupapa-claude-fixes]
    paths:
      - 'factupapa-next/**'
      - '.github/workflows/factupapa-next-runner.yml'
      - '.github/workflows/factupapa-next-integration.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: factupapa-next-rootless-${{ github.ref }}
  # Staging only needs the newest branch state. Avoid spending the single
  # rootless runner on superseded commits when several files are published.
  cancel-in-progress: true

jobs:
  rootless-audit:
    runs-on: [self-hosted, linux, x64, factupapa-next]
    timeout-minutes: 60
    env:
      DOCKER_HOST: unix:///run/user/1001/docker.sock
      COMPOSE_PROJECT_NAME: factupapa_audit_${{ github.run_id }}_${{ github.run_attempt }}
      COMPOSE_FILE: docker-compose.yml:docker-compose.integration.yml
      PRESERVE_AUDIT_ARTIFACTS: '1'
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Mark staging validation pending
        if: >-
          github.event_name == 'workflow_dispatch' ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-staging]'))
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"FactuPapa staging","description":"Auditoría y despliegue de staging en curso"}' >/dev/null

      - name: Verify exact SHA and rootless runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(id -u)" = "1001"
          test "${DOCKER_HOST}" = "unix:///run/user/1001/docker.sock"
          test -S "${DOCKER_HOST#unix://}"
          docker info --format '{{json .SecurityOptions}}' | grep -q 'name=rootless'

      - name: Recover existing private staging
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t staging_containers < <(
            docker ps -aq \
              --filter 'label=com.docker.compose.project=factupapa_staging'
          )
          if [ "${#staging_containers[@]}" -eq 0 ]; then
            echo "No existing staging containers to recover"
            exit 0
          fi
          docker start "${staging_containers[@]}" >/dev/null
          for _ in $(seq 1 60); do
            status="$(
              curl --silent --output /dev/null --write-out '%{http_code}' \
                http://127.0.0.1:14173/healthz || true
            )"
            [ "${status}" = "200" ] && exit 0
            sleep 2
          done
          echo "Existing staging did not recover on port 14173" >&2
          docker ps -a \
            --filter 'label=com.docker.compose.project=factupapa_staging' \
            --format 'table {{.Names}}\t{{.Status}}'
          exit 1

      - name: Diagnose imported data visibility
        if: >-
          github.event_name == 'push' &&
          contains(github.event.head_commit.message, '[diagnose-legacy-visibility]')
        shell: bash
        env:
          IMPORT_USER_EMAIL: ${{ secrets.FACTUPAPA_STAGING_EMAIL }}
        run: bash factupapa-next/scripts/diagnose-private-visibility.sh "${GITHUB_WORKSPACE}"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            factupapa-next/apps/api/package-lock.json
            factupapa-next/apps/web/package-lock.json

      - name: Run complete rootless audit
        shell: bash
        run: |
          set -euo pipefail
          test -f factupapa-next/scripts/audit.sh
          test -x factupapa-next/scripts/audit.sh
          # Both audit workflows share fixed localhost ports on the rootless host.
          # A host lock serializes them without GitHub cancelling the other workflow.
          flock -w 3300 /tmp/factupapa-next-rootless-host.lock factupapa-next/scripts/audit.sh

      - name: Upload sanitized fictitious evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: factupapa-rootless-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            factupapa-next/apps/web/test-artifacts
            factupapa-next/apps/web/test-results
            factupapa-next/apps/web/playwright-report
            ${{ runner.temp }}/factupapa-operational-artifacts/api-sanitized.log
            ${{ runner.temp }}/factupapa-operational-artifacts/api-failure-sanitized.log
            ${{ runner.temp }}/factupapa-operational-artifacts/backup-sanitized.log
            ${{ runner.temp }}/factupapa-operational-artifacts/objects-sanitized.log
            ${{ runner.temp }}/factupapa-operational-artifacts/recovery-sanitized.log
            ${{ runner.temp }}/factupapa-operational-artifacts/database-backup.manifest.json
            ${{ runner.temp }}/factupapa-operational-artifacts/object-backup.manifest.json
            ${{ runner.temp }}/factupapa-operational-artifacts/restore-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce final cleanup
        if: always()
        working-directory: factupapa-next/infrastructure
        shell: bash
        run: |
          set +e
          docker compose down -v --remove-orphans
          rm -f .env docker-compose.integration.yml
          rm -rf ../apps/web/test-artifacts ../apps/web/test-results ../apps/web/playwright-report
          rm -rf "${RUNNER_TEMP}/factupapa-operational-artifacts"
          set -e
          test -z "$(docker ps -aq --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")"
          test -z "$(docker volume ls -q --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")"
          test -z "$(docker network ls -q --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}")"

      - name: Mark failed staging validation
        if: >-
          failure() &&
          (
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-staging]'))
          )
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"FactuPapa staging","description":"La auditoría o el despliegue de staging ha fallado"}' >/dev/null

      - name: Deploy exact audited SHA to private staging
        if: >-
          success() &&
          (
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-staging]'))
          )
        shell: bash
        env:
          FACTUPAPA_OWN_TAX_IDS: ${{ secrets.FACTUPAPA_OWN_TAX_IDS }}
          FACTUPAPA_ANTHROPIC_API_KEY: ${{ secrets.FACTUPAPA_ANTHROPIC_API_KEY }}
          FACTUPAPA_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.FACTUPAPA_GOOGLE_OAUTH_CLIENT_ID }}
          FACTUPAPA_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.FACTUPAPA_GOOGLE_OAUTH_CLIENT_SECRET }}
        run: factupapa-next/scripts/deploy-private-staging.sh

      - name: Import private legacy backup
        if: >-
          success() &&
          github.event_name == 'push' &&
          (
            contains(github.event.head_commit.message, '[import-legacy-dry-run]') ||
            contains(github.event.head_commit.message, '[import-legacy-apply]')
          )
        shell: bash
        env:
          IMPORT_USER_EMAIL: ${{ secrets.FACTUPAPA_STAGING_EMAIL }}
          LEGACY_IMPORT_APPLY: ${{ contains(github.event.head_commit.message, '[import-legacy-apply]') && '1' || '0' }}
          LEGACY_BACKUP_GZIP_BASE64: ${{ secrets.FACTUPAPA_LEGACY_BACKUP_GZIP_BASE64 }}
        run: bash factupapa-next/scripts/import-private-legacy.sh "${GITHUB_WORKSPACE}"

  verify-publication:
    needs: rootless-audit
    if: >-
      success() &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-staging]'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify FactuPapa Next from the public Internet
        shell: bash
        env:
          PUBLIC_ORIGIN: https://factupapa-next.46-62-226-95.sslip.io
        run: |
          set -Eeuo pipefail
          for _ in $(seq 1 30); do
            web_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PUBLIC_ORIGIN}/healthz" || true)"
            api_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PUBLIC_ORIGIN}/api/health" || true)"
            if [ "${web_status}" = "200" ] && [ "${api_status}" = "200" ]; then
              curl --silent --show-error "${PUBLIC_ORIGIN}/" | grep -q '<title>FactuPapa Next</title>'
              echo "FactuPapa Next responde por HTTPS desde Internet"
              exit 0
            fi
            sleep 5
          done
          echo "FactuPapa Next no responde correctamente desde Internet" >&2
          exit 1

      - name: Mark staging publication successful
        if: success()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"success","context":"FactuPapa staging","description":"Staging auditado, desplegado y accesible por HTTPS"}' >/dev/null

      - name: Mark staging publication failed
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"failure","context":"FactuPapa staging","description":"Staging no responde correctamente por HTTPS"}' >/dev/null
