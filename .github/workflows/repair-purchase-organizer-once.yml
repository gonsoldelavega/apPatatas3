name: Repair purchase organizer once

on:
  push:
    branches: [codex/factupapa-next-quality-sweep]
    paths:
      - '.github/workflows/repair-purchase-organizer-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical branch
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: codex/factupapa-next-quality-sweep
          fetch-depth: 0

      - name: Patch organizer deterministically
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps-script/gonsol-drive-organizer/Code.gs')
          text = path.read_text()

          replacements = [
              (
                  """    invoiceNumber: function(text, upper) {\n      // Ej: FV006-00000996. El prefijo FV evita capturar el vendedor (\"6 - VENTA ALMACEN\").\n      var match = upper.match(/FV\\s*\\d{2,4}\\s*[-\\/]?\\s*\\d{4,}/);\n      return match ? match[0].replace(/\\s+/g, '') : '';\n    }""",
                  """    invoiceNumber: function(text, upper) {\n      // Formato actual impreso por GAYCA: 006/0002.171.\n      var current = upper.match(/\\b006\\s*\\/\\s*0002\\s*[.]\\s*\\d{3,4}\\b/);\n      if (current) return current[0].replace(/\\s+/g, '');\n      // Formato historico: FV006-00000996.\n      var legacy = upper.match(/FV\\s*\\d{2,4}\\s*[-\\/]?\\s*\\d{4,}/);\n      return legacy ? legacy[0].replace(/\\s+/g, '') : '';\n    }""",
              ),
              (
                  """function processPurchaseInvoicesDaily() {\n  // Primero trae las facturas nuevas que hayan llegado por email (GAYCA);""",
                  """function processPurchaseInvoicesDaily() {\n  // El primer ciclo tras un cambio de version corrige tambien el calendario\n  // de triggers sin depender de una intervencion manual.\n  ensurePurchaseInvoiceSchedule_();\n  // Primero trae las facturas nuevas que hayan llegado por email (GAYCA);""",
              ),
              (
                  """function setupDailyPurchaseInvoiceTrigger() {\n  deleteTriggersForFunction_('processPurchaseInvoicesDaily');\n  ScriptApp\n    .newTrigger('processPurchaseInvoicesDaily')\n    .timeBased()\n    .everyDays(1)\n    .atHour(7)\n    .create();\n}""",
                  """function setupDailyPurchaseInvoiceTrigger() {\n  installPurchaseInvoiceTriggers_();\n}\n\nfunction ensurePurchaseInvoiceSchedule_() {\n  const versionKey = 'purchaseInvoiceTriggerScheduleVersion';\n  const props = PropertiesService.getScriptProperties();\n  if (props.getProperty(versionKey) === 'v3') return;\n  installPurchaseInvoiceTriggers_();\n  props.setProperty(versionKey, 'v3');\n}\n\nfunction installPurchaseInvoiceTriggers_() {\n  deleteTriggersForFunction_('processPurchaseInvoicesDaily');\n  [8, 12, 16, 20].forEach(function(hour) {\n    ScriptApp\n      .newTrigger('processPurchaseInvoicesDaily')\n      .timeBased()\n      .atHour(hour)\n      .nearMinute(0)\n      .everyDays(1)\n      .inTimezone('Europe/Madrid')\n      .create();\n  });\n}""",
              ),
              (
                  """  // Para proveedores conocidos basta con fecha + total para registrar:\n  // el numero puede faltar (se marca en observaciones) y aun asi entra en la hoja.\n  const requiresReview = supplierKnown ? (!date || !total) : (missing.length > 0);""",
                  """  // Una factura sin numero, fecha, proveedor o total no entra en el registro\n  // definitivo aunque el remitente sea conocido. Se deriva a revision para evitar\n  // compras ambiguas y duplicados imposibles de reconciliar en FactuPapa Next.\n  const requiresReview = missing.length > 0;""",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Patron esperado no encontrado; se aborta sin escribir')
              text = text.replace(old, new, 1)

          # La consulta ya excluye FACTURAS_IMPORTADAS. Lo exigimos como invariante:
          # la etiqueta es la marca persistente de correo ya procesado.
          required = " -label:' + GONSOL_GMAIL_IMPORT.processedLabel"
          if required not in text:
              raise SystemExit('Falta exclusion por FACTURAS_IMPORTADAS')

          path.write_text(text)
          PY

      - name: Static checks
        shell: bash
        run: |
          cp apps-script/gonsol-drive-organizer/Code.gs /tmp/gonsol-organizer.js
          node --check /tmp/gonsol-organizer.js
          grep -F "processedLabel: 'FACTURAS_IMPORTADAS'" apps-script/gonsol-drive-organizer/Code.gs
          grep -F "-label:' + GONSOL_GMAIL_IMPORT.processedLabel" apps-script/gonsol-drive-organizer/Code.gs
          grep -F "[8, 12, 16, 20]" apps-script/gonsol-drive-organizer/Code.gs
          grep -F "006\\s*\\/\\s*0002" apps-script/gonsol-drive-organizer/Code.gs
          git diff --check

      - name: Commit repaired organizer
        shell: bash
        run: |
          if git diff --quiet -- apps-script/gonsol-drive-organizer/Code.gs; then
            echo 'Organizer already repaired'
            exit 0
          fi
          git config user.name 'FactuPapa automation'
          git config user.email 'gonsoldelavega@gmail.com'
          git add apps-script/gonsol-drive-organizer/Code.gs
          git commit -m 'fix(purchases): harden Gmail invoice organizer and processed labels'
          git push origin HEAD:codex/factupapa-next-quality-sweep
