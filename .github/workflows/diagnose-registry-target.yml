name: Diagnose registry invoice visibility

on:
  push:
    branches: [codex/factupapa-next-quality-sweep]
    paths: ['.github/workflows/diagnose-registry-target.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, factupapa-next]
    timeout-minutes: 5
    env:
      DOCKER_HOST: unix:///run/user/1001/docker.sock
    steps:
      - name: Trace target row through live CSV and staging PostgreSQL
        shell: bash
        env:
          SYNC_USER_EMAIL: ${{ secrets.FACTUPAPA_STAGING_EMAIL }}
        run: |
          set -Eeuo pipefail
          api="$(docker ps -q --filter 'label=com.docker.compose.project=factupapa_staging' --filter 'label=com.docker.compose.service=api' | head -n1)"
          test -n "$api"
          docker exec -i -e SYNC_USER_EMAIL="$SYNC_USER_EMAIL" "$api" node --input-type=module <<'NODE'
          import { createHash, randomUUID } from 'node:crypto';
          import pg from 'pg';
          import { AuthRepository } from '/app/dist/auth/repository.js';
          import { withTenantTransaction } from '/app/dist/database/client.js';
          import { canonicalInvoiceNumber, canonicalSupplierTaxId } from '/app/dist/finance/invoice-number.js';

          function parseRegistryCsv(value) {
            const rows = [];
            let row = [], field = '', quoted = false;
            const source = value.replace(/\r\n?/g, '\n');
            for (let index = 0; index < source.length; index += 1) {
              const character = source[index];
              if (quoted) {
                if (character === '"' && source[index + 1] === '"') { field += '"'; index += 1; }
                else if (character === '"') quoted = false;
                else field += character;
              } else if (character === '"') quoted = true;
              else if (character === ',') { row.push(field); field = ''; }
              else if (character === '\n') {
                row.push(field);
                if (row.some((cell) => cell.trim())) rows.push(row);
                row = []; field = '';
              } else field += character;
            }
            row.push(field);
            if (row.some((cell) => cell.trim())) rows.push(row);
            return rows.slice(1);
          }
          const text = (value) => String(value ?? '').trim();
          const money = (value) => {
            const normalized = text(value).replace(/\s|€|%/g, '').replace(/\.(?=\d{3}(?:\D|$))/g, '').replace(',', '.');
            const amount = Number(normalized);
            return Number.isFinite(amount) && amount >= 0 ? amount.toFixed(4) : null;
          };
          const date = (value) => {
            const t = text(value);
            const spanish = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
            if (spanish) return `${spanish[3]}-${spanish[2].padStart(2,'0')}-${spanish[1].padStart(2,'0')}`;
            return /^\d{4}-\d{2}-\d{2}$/.test(t) ? t : null;
          };
          const normalizedTaxId = (value) => text(value).toUpperCase().replace(/[^A-Z0-9]/g, '');
          const keyFor = (row) => {
            const link = text(row[18]);
            const driveId = link.match(/\/d\/([A-Za-z0-9_-]+)/)?.[1] ?? link.match(/[?&]id=([A-Za-z0-9_-]+)/)?.[1];
            return driveId ?? createHash('sha256').update(row.join('\u001f')).digest('hex');
          };

          const registryUrl = process.env.PURCHASE_REGISTRY_WEBAPP_URL?.trim();
          if (!registryUrl) throw new Error('purchase_registry_not_configured');
          const response = await fetch(registryUrl, { redirect: 'follow', headers: { Accept: 'text/csv' } });
          const body = await response.text();
          if (!response.ok) throw new Error(`registry_http_${response.status}`);
          const rows = parseRegistryCsv(body);
          const purchases = rows.filter((row) => text(row[2]).toUpperCase() === 'COMPRA');
          const target = purchases.find((row) => /(?:^|\D)0*2171(?:\D|$)/.test(text(row[4]).replace(/[.]/g,''))) ??
            purchases.find((row) => text(row[19]).includes('000002171'));
          if (!target) {
            console.log(JSON.stringify({ status:'FAIL', reason:'target_not_in_live_csv', fetched:purchases.length }));
            process.exit(2);
          }

          const parsed = {
            columns: target.length,
            issueDateRaw: text(target[0]),
            type: text(target[2]),
            invoiceNumber: text(target[4]),
            supplierName: text(target[5]),
            subtotalRaw: text(target[9]),
            taxRateRaw: text(target[10]),
            taxTotalRaw: text(target[11]),
            totalRaw: text(target[12]),
            paymentRaw: text(target[13]),
            driveUrlPresent: Boolean(text(target[18])),
            filename: text(target[19]),
            reviewedRaw: text(target[20]),
            issueDate: date(target[0]),
            subtotal: money(target[9]),
            taxTotal: money(target[11]),
            total: money(target[12]),
            key: keyFor(target),
          };

          const { Pool } = pg;
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          try {
            const user = await new AuthRepository(pool).findUserByEmail(process.env.SYNC_USER_EMAIL.trim().toLowerCase());
            if (!user) throw new Error('sync_user_not_found');
            const { passwordHash: _, ...base } = user;
            const identity = { ...base, familyId: randomUUID() };
            const db = await withTenantTransaction(pool, identity, async (client) => {
              const keyRows = (await client.query(`
                select id,supplier_invoice_number as "invoiceNumber",issue_date::text as "issueDate",status,total::text
                from purchase_invoices where source_registry_key=$1
              `,[parsed.key])).rows;
              const supplier = (await client.query(`
                select id,legal_name,tax_id from contacts
                where is_active and kind in('supplier','both')
                  and (($1::text <> '' and regexp_replace(upper(coalesce(tax_id,'')),'[^A-Z0-9]','','g')=$1)
                    or lower(btrim(legal_name))=lower(btrim($2)))
                order by case when $1::text <> '' and regexp_replace(upper(coalesce(tax_id,'')),'[^A-Z0-9]','','g')=$1 then 0 else 1 end
                limit 1
              `,[normalizedTaxId(target[6]),text(target[5])])).rows[0] ?? null;
              let duplicates = [];
              if (supplier && parsed.issueDate && parsed.invoiceNumber) {
                duplicates = (await client.query(`
                  select id,supplier_invoice_number as "invoiceNumber",issue_date::text as "issueDate",status,
                         source_registry_key as "sourceRegistryKey",total::text
                  from purchase_invoices
                  where company_id=$1 and supplier_tax_identity_key=$2
                    and supplier_invoice_number_key=$3
                    and extract(year from issue_date)=extract(year from $4::date)
                    and status<>'cancelled'
                `,[identity.companyId, canonicalSupplierTaxId(supplier.tax_id) ?? supplier.id, canonicalInvoiceNumber(parsed.invoiceNumber), parsed.issueDate])).rows;
              }
              return { keyRows, supplierFound:Boolean(supplier), duplicates };
            });
            console.log(JSON.stringify({ status:'PASS', fetched:purchases.length, parsed, db }));
          } finally { await pool.end(); }
          NODE
