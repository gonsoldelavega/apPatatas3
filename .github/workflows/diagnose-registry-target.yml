name: Diagnose registry invoice visibility

on:
  push:
    branches: [codex/factupapa-next-quality-sweep]
    paths: ['.github/workflows/diagnose-registry-target.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: [self-hosted, linux, x64, factupapa-next]
    timeout-minutes: 5
    env:
      DOCKER_HOST: unix:///run/user/1001/docker.sock
    steps:
      - name: Verify invoice 2171 through FactuPapa finance service
        shell: bash
        env:
          SYNC_USER_EMAIL: ${{ secrets.FACTUPAPA_STAGING_EMAIL }}
        run: |
          set -Eeuo pipefail
          api="$(docker ps -q --filter 'label=com.docker.compose.project=factupapa_staging' --filter 'label=com.docker.compose.service=api' | head -n1)"
          test -n "$api"
          docker exec -i -e SYNC_USER_EMAIL="$SYNC_USER_EMAIL" "$api" node --input-type=module <<'NODE'
          import { randomUUID } from 'node:crypto';
          import pg from 'pg';
          import { AuthRepository } from '/app/dist/auth/repository.js';
          import { FinanceService } from '/app/dist/finance/service.js';
          import { withTenantTransaction } from '/app/dist/database/client.js';

          const { Pool } = pg;
          const pool = new Pool({ connectionString: process.env.DATABASE_URL });
          try {
            const user = await new AuthRepository(pool).findUserByEmail(process.env.SYNC_USER_EMAIL.trim().toLowerCase());
            if (!user) throw new Error('sync_user_not_found');
            const { passwordHash: _, ...base } = user;
            const identity = { ...base, familyId: randomUUID() };
            const finance = new FinanceService(pool);
            const purchases = await finance.listPurchases(identity, { from: '2026-09-01', to: '2026-09-30' });
            const visible = purchases.filter((row) => String(row.supplierInvoiceNumber ?? '').replace(/\D/g,'').includes('2171'));
            const detail = await withTenantTransaction(pool, identity, async (client) => (
              await client.query(`
                select i.id,i.supplier_invoice_number as "invoiceNumber",i.issue_date::text as "issueDate",
                       i.status,i.subtotal::text,i.tax_total::text,i.total::text,
                       i.source_registry_key is not null as "fromRegistry",
                       i.source_registry_filename as "registryFilename",
                       coalesce(sum(p.amount),0)::text as "paidAmount"
                from purchase_invoices i
                left join payments p on p.purchase_invoice_id=i.id
                where i.company_id=$1 and i.deleted_at is null
                  and regexp_replace(coalesce(i.supplier_invoice_number,''),'[^0-9]','','g') like '%2171%'
                group by i.id
                order by i.created_at desc
              `,[identity.companyId])
            )).rows;
            console.log(JSON.stringify({ status:'PASS', visibleThroughFinanceService:visible, detail }));
            const row = detail[0];
            if (!row || row.issueDate !== '2026-09-03' || row.status !== 'confirmed' || row.fromRegistry !== true || Number(row.total) !== 102.96 || Number(row.paidAmount) !== 102.96 || visible.length < 1) {
              process.exit(3);
            }
          } finally { await pool.end(); }
          NODE
          echo 'INVOICE_2171_APP_SERVICE=PASS'

      - name: Verify staging health
        shell: bash
        run: |
          set -Eeuo pipefail
          curl --fail --silent --show-error https://factupapa-next.46-62-226-95.sslip.io/healthz >/dev/null
          curl --fail --silent --show-error https://factupapa-next.46-62-226-95.sslip.io/api/health >/dev/null
          echo 'WEB_HEALTH=200'
          echo 'API_HEALTH=200'
