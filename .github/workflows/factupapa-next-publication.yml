name: FactuPapa Next direct-public preflight

on:
  workflow_dispatch:
  push:
    branches: [codex/factupapa-claude-fixes]
    paths:
      - '.github/workflows/factupapa-next-publication.yml'

permissions:
  contents: read

concurrency:
  group: factupapa-next-publication
  cancel-in-progress: true

jobs:
  inspect-vps:
    runs-on: [self-hosted, linux, x64, factupapa-next]
    timeout-minutes: 5
    outputs:
      public-ip: ${{ steps.network.outputs.public-ip }}
      candidate-host: ${{ steps.network.outputs.candidate-host }}
    steps:
      - name: Verify the private application is healthy
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(id -u)" = "1001"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' http://127.0.0.1:14173/healthz)" = "200"
          curl --silent --show-error http://127.0.0.1:14173/ | grep -q '<title>FactuPapa Next</title>'

      - name: Discover the direct public hostname
        id: network
        shell: bash
        run: |
          set -Eeuo pipefail
          public_ip="$(curl --ipv4 --fail --silent --show-error https://api.ipify.org)"
          printf '%s' "${public_ip}" | grep -Eq '^([0-9]{1,3}\.){3}[0-9]{1,3}$'
          candidate_host="factupapa-next.${public_ip//./-}.sslip.io"
          resolved_ip="$(getent ahostsv4 "${candidate_host}" | awk 'NR == 1 { print $1 }')"
          test "${resolved_ip}" = "${public_ip}"
          echo "public-ip=${public_ip}" >>"${GITHUB_OUTPUT}"
          echo "candidate-host=${candidate_host}" >>"${GITHUB_OUTPUT}"
          echo "IP publica detectada: ${public_ip}"
          echo "Hostname HTTPS candidato: ${candidate_host}"

      - name: Inspect listeners, proxy and administration capability
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Puertos locales 80/443:"
          listeners="$(ss -ltnH | awk '$4 ~ /:80$/ || $4 ~ /:443$/ { print $4 }' | sort -u)"
          if [ -n "${listeners}" ]; then
            printf '%s\n' "${listeners}"
          else
            echo "ninguno"
          fi

          for service in caddy nginx; do
            if command -v "${service}" >/dev/null 2>&1; then
              echo "${service}: instalado"
            else
              echo "${service}: no instalado"
            fi
            echo "${service} service: $(systemctl is-active "${service}" 2>/dev/null || true)"
          done

          echo "Puerto minimo rootless: $(sysctl -n net.ipv4.ip_unprivileged_port_start 2>/dev/null || echo desconocido)"
          if sudo -n true 2>/dev/null; then
            echo "sudo no interactivo: disponible"
            sudo -n ufw status 2>/dev/null || echo "ufw: no disponible"
          else
            echo "sudo no interactivo: no disponible"
          fi

          if command -v tailscale >/dev/null 2>&1 && timeout 5s tailscale funnel status --json 2>/dev/null | grep -Fq '127.0.0.1:14173'; then
            echo "AVISO: se detecto una ruta Funnel previa"
          else
            echo "Funnel previo: no detectado"
          fi

  inspect-from-internet:
    needs: inspect-vps
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check whether HTTP and HTTPS reach the VPS
        env:
          PUBLIC_IP: ${{ needs.inspect-vps.outputs.public-ip }}
          CANDIDATE_HOST: ${{ needs.inspect-vps.outputs.candidate-host }}
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Comprobando ${CANDIDATE_HOST} (${PUBLIC_IP}) desde Internet"
          for port in 80 443; do
            if timeout 5s bash -c "</dev/tcp/${PUBLIC_IP}/${port}" 2>/dev/null; then
              echo "Puerto ${port}: accesible"
            else
              echo "Puerto ${port}: no accesible"
            fi
          done
