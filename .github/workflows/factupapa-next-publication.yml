name: FactuPapa Next public endpoint check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factupapa-next-publication
  cancel-in-progress: true

jobs:
  verify-from-internet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check HTTPS, application and API
        shell: bash
        env:
          PUBLIC_ORIGIN: https://factupapa-next.46-62-226-95.sslip.io
        run: |
          set -Eeuo pipefail
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PUBLIC_ORIGIN}/healthz")" = "200"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${PUBLIC_ORIGIN}/api/health")" = "200"
          curl --silent --show-error "${PUBLIC_ORIGIN}/" | grep -q '<title>FactuPapa Next</title>'
