name: Deploy Apps Script

# Publica el organizador de compras de la rama canónica, verifica la fuente remota,
# actualiza el deployment WEB_APP versionado y comprueba el estado del calendario
# de ingesta Gmail -> Drive -> Registro Maestro.

on:
  push:
    branches:
      - codex/factupapa-next-quality-sweep
    paths:
      - "apps-script/gonsol-drive-organizer/**"
      - ".github/workflows/deploy-appsscript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Comprobar secretos
        env:
          CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
          CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLASP_REFRESH_TOKEN" || { echo "Falta el secreto CLASP_REFRESH_TOKEN"; exit 1; }
          test -n "$CLASP_CLIENT_ID" || { echo "Falta el secreto CLASP_CLIENT_ID"; exit 1; }
          test -n "$CLASP_CLIENT_SECRET" || { echo "Falta el secreto CLASP_CLIENT_SECRET"; exit 1; }
          test -n "$SCRIPT_ID" || { echo "Falta el secreto SCRIPT_ID"; exit 1; }

      - name: Escribir credenciales de clasp 3
        env:
          CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
          CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          RT="$(printf '%s' "$CLASP_REFRESH_TOKEN" | tr -d '\r\n')"
          CID="$(printf '%s' "$CLASP_CLIENT_ID" | tr -d '\r\n')"
          CS="$(printf '%s' "$CLASP_CLIENT_SECRET" | tr -d '\r\n')"
          jq -n --arg rt "$RT" --arg cid "$CID" --arg cs "$CS" \
            '{tokens:{default:{type:"authorized_user",client_id:$cid,client_secret:$cs,refresh_token:$rt}}}' \
            > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Configurar proyecto Apps Script
        working-directory: apps-script/gonsol-drive-organizer
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json

      - name: Push a Apps Script
        working-directory: apps-script/gonsol-drive-organizer
        run: |
          set -euo pipefail
          clasp --version
          LOG_FILE="$(mktemp)"
          if ! clasp push --force 2>&1 | tee "$LOG_FILE"; then
            echo "clasp push devolvio error"
            exit 1
          fi
          if grep -Eiq 'Push failed|No access, refresh token|Error:' "$LOG_FILE"; then
            echo "clasp informo un fallo aunque el proceso devolviera codigo 0"
            exit 1
          fi

      - name: Verificar fuente remota exacta
        working-directory: apps-script/gonsol-drive-organizer
        env:
          CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
          CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          TOKEN_JSON="$(mktemp)"
          REMOTE_JSON="$(mktemp)"
          REMOTE_CODE="$(mktemp)"
          REMOTE_MANIFEST="$(mktemp)"
          curl -fsS https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLASP_CLIENT_ID" \
            --data-urlencode "client_secret=$CLASP_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CLASP_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" > "$TOKEN_JSON"
          ACCESS_TOKEN="$(jq -r '.access_token // empty' "$TOKEN_JSON")"
          test -n "$ACCESS_TOKEN" || { echo "No se pudo obtener access token de Google"; exit 1; }
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" > "$REMOTE_JSON"
          jq -rj '.files[] | select(.name == "Code") | .source' "$REMOTE_JSON" > "$REMOTE_CODE"
          jq -rj '.files[] | select(.name == "appsscript") | .source' "$REMOTE_JSON" > "$REMOTE_MANIFEST"
          test -s "$REMOTE_CODE" || { echo "Apps Script remoto no contiene Code.gs"; exit 1; }
          test -s "$REMOTE_MANIFEST" || { echo "Apps Script remoto no contiene appsscript.json"; exit 1; }
          cmp -s Code.gs "$REMOTE_CODE" || { echo "Code.gs remoto no coincide con el SHA desplegado"; exit 1; }
          cmp -s appsscript.json "$REMOTE_MANIFEST" || { echo "appsscript.json remoto no coincide con el SHA desplegado"; exit 1; }
          echo "SOURCE_DEPLOY=PASS"

      - name: Versionar y actualizar WEB_APP
        id: deployment
        env:
          CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
          CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          TOKEN_JSON="$(mktemp)"
          curl -fsS https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLASP_CLIENT_ID" \
            --data-urlencode "client_secret=$CLASP_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CLASP_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" > "$TOKEN_JSON"
          ACCESS_TOKEN="$(jq -r '.access_token // empty' "$TOKEN_JSON")"
          test -n "$ACCESS_TOKEN" || { echo "No se pudo obtener access token"; exit 1; }

          VERSION_JSON="$(mktemp)"
          HTTP="$(curl -sS -o "$VERSION_JSON" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -nc --arg d "FactuPapa purchase pipeline $GITHUB_SHA" '{description:$d}')" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/versions")"
          if [ "$HTTP" != "200" ]; then
            echo "No se pudo crear version de Apps Script (HTTP $HTTP)"
            jq '{error}' "$VERSION_JSON" || cat "$VERSION_JSON"
            exit 1
          fi
          VERSION="$(jq -r '.versionNumber // empty' "$VERSION_JSON")"
          test -n "$VERSION" || { echo "Version vacia"; exit 1; }

          DEPLOYMENTS="$(mktemp)"
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments" > "$DEPLOYMENTS"
          DEPLOYMENT_ID="$(jq -r '.deployments[]? | select(any(.entryPoints[]?; .entryPointType == "WEB_APP")) | .deploymentId' "$DEPLOYMENTS" | head -n1)"

          UPDATED="$(mktemp)"
          DESCRIPTION="FactuPapa purchase pipeline $GITHUB_SHA"
          if [ -n "$DEPLOYMENT_ID" ]; then
            # Google projects.deployments.update exige UpdateDeploymentRequest,
            # es decir, deploymentConfig envuelto en el cuerpo.
            BODY="$(jq -nc --arg sid "$SCRIPT_ID" --argjson ver "$VERSION" --arg d "$DESCRIPTION" \
              '{deploymentConfig:{scriptId:$sid,versionNumber:$ver,manifestFileName:"appsscript",description:$d}}')"
            HTTP="$(curl -sS -o "$UPDATED" -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$BODY" \
              "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments/$DEPLOYMENT_ID")"
          else
            # Google projects.deployments.create recibe DeploymentConfig directo;
            # scriptId ya viaja en el path.
            BODY="$(jq -nc --argjson ver "$VERSION" --arg d "$DESCRIPTION" \
              '{versionNumber:$ver,manifestFileName:"appsscript",description:$d}')"
            HTTP="$(curl -sS -o "$UPDATED" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$BODY" \
              "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments")"
            DEPLOYMENT_ID="$(jq -r '.deploymentId // empty' "$UPDATED")"
          fi
          if [ "$HTTP" != "200" ]; then
            echo "No se pudo publicar WEB_APP (HTTP $HTTP)"
            jq '{error}' "$UPDATED" || cat "$UPDATED"
            exit 1
          fi

          DEPLOYMENTS2="$(mktemp)"
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/deployments" > "$DEPLOYMENTS2"
          WEB_URL="$(jq -r --arg id "$DEPLOYMENT_ID" '.deployments[]? | select(.deploymentId == $id) | .entryPoints[]? | select(.entryPointType == "WEB_APP") | .webApp.url' "$DEPLOYMENTS2" | head -n1)"
          test -n "$WEB_URL" || { echo "El deployment actualizado no expone WEB_APP"; jq '.deployments[]? | {deploymentId,entryPoints}' "$DEPLOYMENTS2"; exit 1; }
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "web_url=$WEB_URL" >> "$GITHUB_OUTPUT"
          echo "WEBAPP_DEPLOY=PASS version=$VERSION deployment=$DEPLOYMENT_ID"

      - name: Verificar Registro Maestro y auto-reparar calendario
        id: registry
        env:
          WEB_URL: ${{ steps.deployment.outputs.web_url }}
        run: |
          set -euo pipefail
          RESPONSE1="$(mktemp)"
          RESPONSE2="$(mktemp)"
          curl -fsSL "$WEB_URL" > "$RESPONSE1"
          sleep 2
          curl -fsSL "$WEB_URL" > "$RESPONSE2"
          jq -e '.ok == true and (.rows | type == "array")' "$RESPONSE2" >/dev/null
          echo "REGISTRY_WEBAPP=PASS"
          jq '{ok,count,source,scheduler}' "$RESPONSE2"
          SCHED_OK="$(jq -r '.scheduler.ok // false' "$RESPONSE2")"
          TRIGGERS="$(jq -r '.scheduler.triggerCount // 0' "$RESPONSE2")"
          SCHEDULE_VERSION="$(jq -r '.scheduler.scheduleVersion // ""' "$RESPONSE2")"
          AUTH_REQUIRED="$(jq -r '.scheduler.authorizationRequired // false' "$RESPONSE2")"
          echo "scheduler_ok=$SCHED_OK" >> "$GITHUB_OUTPUT"
          echo "trigger_count=$TRIGGERS" >> "$GITHUB_OUTPUT"
          echo "schedule_version=$SCHEDULE_VERSION" >> "$GITHUB_OUTPUT"
          echo "authorization_required=$AUTH_REQUIRED" >> "$GITHUB_OUTPUT"
          if [ "$SCHED_OK" = "true" ] && [ "$TRIGGERS" = "4" ] && [ "$SCHEDULE_VERSION" = "v4" ]; then
            echo "PURCHASE_SCHEDULER=PASS"
          else
            echo "::warning::PURCHASE_SCHEDULER=NEEDS_AUTH_OR_REPAIR triggers=$TRIGGERS version=$SCHEDULE_VERSION authRequired=$AUTH_REQUIRED"
          fi

      - name: Resultado
        run: |
          echo "SOURCE_DEPLOY=PASS"
          echo "WEBAPP_DEPLOY=PASS"
          echo "VERSION=${{ steps.deployment.outputs.version }}"
          echo "DEPLOYMENT=${{ steps.deployment.outputs.deployment_id }}"
          echo "SCHEDULER_OK=${{ steps.registry.outputs.scheduler_ok }}"
          echo "TRIGGER_COUNT=${{ steps.registry.outputs.trigger_count }}"
          echo "SCHEDULE_VERSION=${{ steps.registry.outputs.schedule_version }}"
          echo "AUTHORIZATION_REQUIRED=${{ steps.registry.outputs.authorization_required }}"
