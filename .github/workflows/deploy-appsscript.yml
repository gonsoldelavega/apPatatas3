name: Deploy Apps Script

# Despliega automaticamente el agente compartido de compras
# (apps-script/gonsol-drive-organizer) desde la rama canonica de FactuPapa Next.
# El organizador es quien lee Gmail/Drive, marca correos procesados y alimenta
# el Registro Maestro que FactuPapa Next sincroniza de forma supervisada.
# Cualquier cambio del organizador o de este workflow publica el SHA exacto.
#
# Requiere cuatro secretos del repositorio (Settings -> Secrets and variables -> Actions):
#   - CLASP_REFRESH_TOKEN
#   - CLASP_CLIENT_ID
#   - CLASP_CLIENT_SECRET
#   - SCRIPT_ID

on:
  push:
    branches:
      - codex/factupapa-next-quality-sweep
    paths:
      - "apps-script/gonsol-drive-organizer/**"
      - ".github/workflows/deploy-appsscript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install clasp
        run: npm install -g @google/clasp@3.3.0

      - name: Comprobar secretos
        env:
          CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
          CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLASP_REFRESH_TOKEN" || { echo "Falta el secreto CLASP_REFRESH_TOKEN"; exit 1; }
          test -n "$CLASP_CLIENT_ID" || { echo "Falta el secreto CLASP_CLIENT_ID"; exit 1; }
          test -n "$CLASP_CLIENT_SECRET" || { echo "Falta el secreto CLASP_CLIENT_SECRET"; exit 1; }
          test -n "$SCRIPT_ID" || { echo "Falta el secreto SCRIPT_ID"; exit 1; }

      - name: Escribir credenciales de clasp 3
        env:
          CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
          CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          RT="$(printf '%s' "$CLASP_REFRESH_TOKEN" | tr -d '\r\n')"
          CID="$(printf '%s' "$CLASP_CLIENT_ID" | tr -d '\r\n')"
          CS="$(printf '%s' "$CLASP_CLIENT_SECRET" | tr -d '\r\n')"
          jq -n \
            --arg rt "$RT" \
            --arg cid "$CID" \
            --arg cs "$CS" \
            '{tokens:{default:{type:"authorized_user",client_id:$cid,client_secret:$cs,refresh_token:$rt}}}' \
            > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Configurar proyecto Apps Script
        working-directory: apps-script/gonsol-drive-organizer
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          printf '{"scriptId":"%s","rootDir":"."}\n' "$SCRIPT_ID" > .clasp.json

      - name: Push a Apps Script
        working-directory: apps-script/gonsol-drive-organizer
        run: |
          set -euo pipefail
          clasp --version
          LOG_FILE="$(mktemp)"
          if ! clasp push --force 2>&1 | tee "$LOG_FILE"; then
            echo "clasp push devolvio error"
            exit 1
          fi
          if grep -Eiq 'Push failed|No access, refresh token|Error:' "$LOG_FILE"; then
            echo "clasp informo un fallo aunque el proceso devolviera codigo 0"
            exit 1
          fi

      - name: Verificar fuente remota exacta
        working-directory: apps-script/gonsol-drive-organizer
        env:
          CLASP_REFRESH_TOKEN: ${{ secrets.CLASP_REFRESH_TOKEN }}
          CLASP_CLIENT_ID: ${{ secrets.CLASP_CLIENT_ID }}
          CLASP_CLIENT_SECRET: ${{ secrets.CLASP_CLIENT_SECRET }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          set -euo pipefail
          TOKEN_JSON="$(mktemp)"
          REMOTE_JSON="$(mktemp)"
          REMOTE_CODE="$(mktemp)"
          REMOTE_MANIFEST="$(mktemp)"

          curl -fsS https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CLASP_CLIENT_ID" \
            --data-urlencode "client_secret=$CLASP_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CLASP_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" \
            > "$TOKEN_JSON"

          ACCESS_TOKEN="$(jq -r '.access_token // empty' "$TOKEN_JSON")"
          test -n "$ACCESS_TOKEN" || { echo "No se pudo obtener access token de Google"; exit 1; }

          curl -fsS \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://script.googleapis.com/v1/projects/$SCRIPT_ID/content" \
            > "$REMOTE_JSON"

          jq -rj '.files[] | select(.name == "Code") | .source' "$REMOTE_JSON" > "$REMOTE_CODE"
          jq -rj '.files[] | select(.name == "appsscript") | .source' "$REMOTE_JSON" > "$REMOTE_MANIFEST"

          test -s "$REMOTE_CODE" || { echo "Apps Script remoto no contiene Code.gs"; exit 1; }
          test -s "$REMOTE_MANIFEST" || { echo "Apps Script remoto no contiene appsscript.json"; exit 1; }

          cmp -s Code.gs "$REMOTE_CODE" || {
            echo "Code.gs remoto no coincide con el SHA desplegado"
            exit 1
          }
          cmp -s appsscript.json "$REMOTE_MANIFEST" || {
            echo "appsscript.json remoto no coincide con el SHA desplegado"
            exit 1
          }

          echo "Apps Script verificado: Code.gs y appsscript.json coinciden exactamente con $GITHUB_SHA"
