name: One-time delete all Actions artifacts

on:
  push:
    branches:
      - automation/factupapa-staging-tasks
    paths:
      - .github/workflows/factupapa-actions-delete-all-artifacts.yml

permissions:
  actions: write
  contents: read

jobs:
  delete-all-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete every retained Actions artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          artifacts_file="${RUNNER_TEMP}/artifact-ids.txt"
          gh api --paginate             "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100"             --jq '.artifacts[].id' > "${artifacts_file}"

          total="$(wc -l < "${artifacts_file}")"
          deleted=0
          while read -r artifact_id; do
            [ -n "${artifact_id}" ] || continue
            gh api --method DELETE               "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            deleted=$((deleted + 1))
          done < "${artifacts_file}"

          echo "total_artifacts=${total}"
          echo "deleted_artifacts=${deleted}"
